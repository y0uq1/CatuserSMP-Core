# ============================================================
#  CatuserSMP-Core - 主配置
#  修改后执行 /catuser reload 生效
# ============================================================

settings:
  # 是否在控制台输出调试信息（模块启停、命令执行细节等）
  debug: false

modules:
  # 玩家加入：不再向全服广播 "xxx 加入了游戏"，仅在控制台输出绿色 [+]
  silent-join:
    enabled: true

  # 玩家退出：不再向全服广播 "xxx 退出了游戏"，仅在控制台输出红色 [-]
  silent-quit:
    enabled: true

  # 极限模式死亡：立即切换旁观者模式，并停留在死亡位置
  hardcore-death:
    enabled: true
    # 仅对 hardcore 世界生效；改为 false 则所有世界都按此逻辑处理
    only-hardcore: true

  # 聊天拦截：拦截玩家发出的消息，使其不会广播给其他玩家
  chat-interceptor:
    enabled: true
    # true = 拦截所有玩家聊天；false = 只拦截命中 blocked-words 的消息
    block-all: true
    # 关键词列表（不区分大小写，包含即拦截），仅在 block-all 为 false 时生效
    blocked-words: []
    # 被拦截时是否提示发送者
    notify-sender: true
    # 是否把被拦截的消息记录到控制台
    log-blocked: true

  # 退出清空背包：玩家退出时清空背包（OP 与 bypass.yml 名单内的玩家除外）
  clear-inventory:
    enabled: true
