# ============================================================
#  CatuserSMP-Core - 文本配置（MiniMessage 格式）
#  语法参考: https://docs.advntr.dev/minimessage/format.html
#  颜色示例: <red> <#ff8800> <gradient:#00d4ff:#0066ff> <bold>
# ============================================================

# 全局前缀，任意消息中可用 <prefix> 引用
prefix: '<gradient:#00d4ff:#0066ff><bold>CatuserSMP</bold></gradient> <dark_gray>»</dark_gray> '

command:
  no-permission: '<prefix><red>你没有权限执行该命令。'
  player-only: '<prefix><red>该命令只能由玩家执行。'
  unknown: '<prefix><red>未知的子命令 <white><input></white>，输入 <yellow>/catuser help</yellow> 查看帮助。'
  usage: '<prefix><gray>用法: <white><usage>'
  error: '<prefix><red>命令执行失败，请查看控制台日志。'

help:
  header: '<prefix><gray>可用命令:'
  entry: '<dark_gray>  ▪ </dark_gray><yellow><usage></yellow> <dark_gray>-</dark_gray> <gray><description>'
  footer: '<dark_gray> 提示: 使用 Tab 键可以自动补全命令。'

info:
  header: '<prefix><gray>插件信息'
  version: '<dark_gray>  ▪ </dark_gray><gray>插件版本: <white><version>'
  server: '<dark_gray>  ▪ </dark_gray><gray>服务端: <white><server>'
  java: '<dark_gray>  ▪ </dark_gray><gray>Java: <white><java>'
  modules: '<dark_gray>  ▪ </dark_gray><gray>模块: <white><enabled></white><gray>/<white><total>'
  footer: '<dark_gray>  CatuserSMP-Core - Paper 插件框架'

reload:
  success: '<prefix><green>配置已重新加载 <dark_gray>(<white><time>ms</white>)</dark_gray>'
  failed: '<prefix><red>重载失败，请查看控制台日志。'

# 仅输出到控制台的玩家进出记录
console:
  join: '<green>[+] <player>'
  quit: '<red>[-] <player>'
  chat-blocked: '<gray>[chat] <white><player><gray>: <white><message>'

chat:
  blocked: '<prefix><red>你的消息已被服务器拦截。'

kit:
  unknown-sub: '<prefix><red>未知的 kit 子命令: <white><input></white>（load / save / loadall）'
  not-found: '<prefix><red>找不到 kit: <white><kit>'
  empty: '<prefix><red>该 kit 没有任何物品: <white><kit>'
  invalid-name: '<prefix><red>kit 名字只能包含字母、数字、下划线和连字符（最长 32 个字符）。'
  player-not-found: '<prefix><red>找不到在线玩家: <white><player>'
  saved: '<prefix><green>已保存 kit <white><kit></white> <dark_gray>(<white><count></white> 件物品)</dark_gray>'
  overwritten: '<prefix><green>已覆盖 kit <white><kit></white> <dark_gray>(<white><count></white> 件物品)</dark_gray>'
  save-empty: '<prefix><red>你的背包是空的，无法保存为 kit。'
  save-failed: '<prefix><red>保存 kit 失败，请查看控制台日志。'
  given: '<prefix><green>已将 kit <white><kit></white> 发给 <white><player></white>'
  received: '<prefix><green>你收到了礼包 <white><kit></white>'
  load-all: '<prefix><green>已向 <white><count></white> 名玩家发放 kit <white><kit></white>'

module:
  header: '<prefix><gray>模块状态:'
  entry-on: '<dark_gray>  ▪ </dark_gray><white><id></white> <green>开启'
  entry-off: '<dark_gray>  ▪ </dark_gray><white><id></white> <red>关闭'
  unknown: '<prefix><red>未知模块: <white><id>'
  enabled: '<prefix><green>模块 <white><id></white> 已开启'
  disabled: '<prefix><yellow>模块 <white><id></white> 已关闭'
  invalid-value: '<prefix><red>无效的开关值: <white><value></white>（可用 on / off / toggle）'

